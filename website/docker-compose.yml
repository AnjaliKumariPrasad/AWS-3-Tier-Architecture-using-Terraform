services:

  frontend:

    build:
      context: ./frontend

    container_name: frontend

    ports:
      - "3000:80"

    depends_on:
      - api


  api:

    build: .

    container_name: task-api

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:anjali%40678@db:5432/taskdb

    depends_on:
      - db


  db:

    image: postgres:16

    container_name: postgres-db

    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: anjali@678

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: